# Terraform CI workflow
#
# Validates Terraform configuration on pull requests and supports manual runs.
# Authenticates to Azure with OpenID Connect (OIDC) — no long-lived credentials
# are stored in the repository.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   AZURE_CLIENT_ID       — Application (client) ID of the federated identity app registration
#   AZURE_TENANT_ID       — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID — Target Azure subscription ID
#
# Terraform input variables are read from TF_VAR_* environment variables.
# Configure additional secrets or variables (e.g. TF_VAR_resource_group_name)
# so `terraform plan` can evaluate the full configuration.

name: Terraform

on:
  # Run automatically when Terraform code or this workflow changes on PRs
  # targeting protected integration branches.
  pull_request:
    branches:
      - development
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

  # Allow operators to re-run the pipeline on demand (e.g. after secret rotation).
  workflow_dispatch:

# Least-privilege permissions: read repo contents; mint an OIDC token for Azure login.
permissions:
  contents: read
  id-token: write

# All shell steps run from the Terraform root module directory.
defaults:
  run:
    working-directory: terraform

jobs:
  terraform:
    name: Validate and plan
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      # Map Azure subscription secret to the Terraform variable expected by main.tf.
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: rg-checkout-assessment-dev
      TF_VAR_location: uksouth
      TF_VAR_environment: dev
      TF_VAR_project_name: checkout-api
      TF_VAR_apim_publisher_email: ${{ vars.APIM_PUBLISHER_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        # Disable the plan output wrapper so stdout matches local CLI behaviour.
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false
